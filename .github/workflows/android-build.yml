name: Android Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    # 关闭 read-only 缓存,允许新构建覆盖旧缓存项
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      # 下载代码
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 JDK 17
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 防御性:删除 local.properties(避免 AGP 误用 Windows 本机 SDK 路径)
      - name: Remove local.properties if present
        run: |
          for f in local.properties app/local.properties; do
            if [ -f "$f" ]; then
              echo "::warning::Removing $f (its sdk.dir is invalid for this runner)"
              rm -f "$f"
            fi
          done

      # 安装 Android SDK
      - name: Setup Android SDK
        id: android-sdk
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools: latest
          platforms: android-34
          build-tools: 34.0.0
          cache-disabled: false

      # 同意 SDK 许可
      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      # 调试:确认 SDK 已正确安装(没有这一行,后面 AGP 静默失败时不知道原因)
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "--- platforms ---"
          ls -la $ANDROID_HOME/platforms/ 2>&1
          echo "--- build-tools ---"
          ls -la $ANDROID_HOME/build-tools/ 2>&1
          echo "--- aapt2 version ---"
          $ANDROID_HOME/build-tools/34.0.0/aapt2 version 2>&1 || echo "aapt2 NOT FOUND"

      # 彻底清理可能污染的构建/缓存
      - name: Clean previous build outputs
        run: |
          rm -rf app/build
          rm -rf .gradle
          rm -rf ~/.gradle/caches/build-cache-1

      # 配置 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          # 关键:让缓存可写,新构建能覆盖旧的损坏缓存
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          # 关闭 Gradle home 缓存,避免和构建缓存混淆
          gradle-home-cache-cleanup: true

      # 给 gradlew 加执行位(从 Windows 提交会丢失 +x)
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 编译 Debug APK
      # --rerun-tasks: 强制重跑所有任务,不用任何缓存
      # --no-build-cache: 关闭 build cache
      # --no-daemon: CI 上不必要
      # --stacktrace: 出错时看堆栈
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --rerun-tasks --no-build-cache --stacktrace

      # 调试:确认 APK 真的生成了
      - name: Verify APK output
        run: |
          ls -la app/build/outputs/apk/debug/ 2>&1
          echo "---"
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK file: $APK"
          if [ -f "$APK" ]; then
            echo "APK size: $(du -h $APK | cut -f1)"
            echo "--- APK 内容列表 ---"
            unzip -l "$APK" 2>&1 | head -30
          else
            echo "::error::APK was not produced!"
            exit 1
          fi

      # 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
