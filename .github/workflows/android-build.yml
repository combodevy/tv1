name: Android Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      # 下载代码
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 JDK 17
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 安装 Android SDK(关键!gradle/actions/setup-gradle 不会自动装 SDK)
      # 仅安装构建所需组件,减少 Runner 磁盘与下载耗时
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 显式固定 cmdline-tools / platform-tools / platform / build-tools
          cmdline-tools: latest
          platforms: android-34
          build-tools: 34.0.0
          cache-disabled: false

      # 同意 SDK 许可(部分 runner 上需要)
      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      # 防御性:删除 local.properties(如果误提交,会指向 Windows 本机路径,导致 AGP 用了错误 SDK)
      - name: Remove local.properties if present
        run: |
          if [ -f local.properties ]; then
            echo "WARNING: removing local.properties (its sdk.dir points to a Windows path that does not exist on this runner)"
            rm -f local.properties
          fi
          if [ -f app/local.properties ]; then
            rm -f app/local.properties
          fi

      # 配置 Gradle(锁定 8.7,兼容 AGP 8.6.1)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # 确保 gradlew 可执行
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 编译 Debug APK
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
